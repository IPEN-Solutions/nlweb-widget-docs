[project]
site_name = "NLWeb Widget 0.9.11"
docs_dir = "docs"

nav = [
  { "Home" = "index.md" },
  { "Concepts" = [
    { "Architecture" = "concepts/architecture.md" },
    { "Protocol" = "concepts/protocol.md" },
    { "Providers and stores" = "concepts/providers-and-stores.md" },
    { "Provider capabilities" = "consumer/providers.md" },
  ] },
  { "Consumer" = [
    { "Quickstart" = "consumer/quickstart.md" },
    { "Configuration" = "consumer/configuration.md" },
    { "Settings reference" = "consumer/settings-reference.md" },
    { "Production" = "consumer/production.md" },
    { "Providers" = "consumer/providers.md" },
    { "Stores" = "consumer/stores.md" },
  ] },
  { "Developer" = [
    { "Extending" = "developer/extending.md" },
    { "Lifecycle" = "developer/lifecycle.md" },
    { "Content synchronization" = "developer/content-sync.md" },
  ] },
  { "Examples" = "examples/visibility.md" },
  { "Contributor" = "contributor/workflow.md" },
  { "Maintainer" = "maintainer/release.md" },
  { "Runbooks" = "runbooks/windows.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
name = "material"
features = ["content.code.copy"]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
